name: Publish Intuish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          # The app lives at /app/. The landing page (landing/ folder) is the front page once it exists.
          mkdir -p _site/app
          cp -r index.html manifest.webmanifest sw.js css js img _site/app/
          touch _site/.nojekyll
          if [ -f landing/index.html ]; then cp landing/index.html _site/index.html; else printf '<!doctype html><meta http-equiv="refresh" content="0; url=app/"><title>Intuish</title>' > _site/index.html; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
