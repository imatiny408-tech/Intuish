<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intuish">
<meta name="theme-color" content="#FBFBFA">
<title>Intuish</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Home -->
<div id="homeView" hidden>
  <div class="wrap">
    <header class="h-top">
      <div class="h-mark"><img class="logo" src="img/logo.png" alt="" width="36" height="36">Intuish</div>
      <div class="h-right">
        <a class="rem-pill" id="remPill" href="#/remember" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="14" height="14" rx="3"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>Remember <b id="remCount">0</b></a>
        <a class="resume-pill" id="resumeBtn" href="#/" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg><span>Resume lesson</span><b></b></a>
        <span class="h-clock" id="homeClock">--:--</span>
        <button class="avatar" id="avatarBtn" aria-label="Settings" aria-haspopup="menu">L</button>
      </div>
    </header>
    <section class="pulse" id="pulse" aria-label="Your study rhythm"></section>
    <div class="sec-h">
      <div style="display:flex;align-items:center;gap:10px"><h3>Studying</h3><button class="addsm" id="addSubj" aria-label="Add a subject"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="arrange-btn" id="arrangeBtn">Arrange</button></div>
      <div class="legend"><span><i class="sw s"></i>Strong</span><span><i class="sw l"></i>Learning</span><span><i class="sw r"></i>Review</span><span><i class="sw n"></i>New</span></div>
    </div>
    <section class="grid" id="grid"></section>
  </div>
</div>

<!-- Ready screen -->
<div id="readyView" hidden>
  <div class="rv">
    <header class="rv-top"><a class="back" id="rvBack" href="#/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="rvSubj">Home</span></a><span class="course" id="rvCourse"></span><span class="brand-mini"><img src="img/logo.png" alt="" width="26" height="26"><b>Intuish</b></span></header>
    <main class="rv-main">
      <div class="rv-crumbs" id="rvCrumbs"></div>
      <h1 id="rvTitle"></h1>
      <div class="rv-facts" id="rvFacts"></div>
      <button class="rv-go" id="rvGo">I’m ready to practice <span aria-hidden="true">→</span></button>
      <button class="ghost" id="rvRestart" hidden>Start this lesson over</button>
    </main>
  </div>
</div>

<!-- Remember -->
<div id="rememberView" hidden>
  <div class="rv">
    <header class="rv-top"><a class="back" href="#/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>Home</span></a><span class="course">Remember</span><span class="h-clock rem-clock" id="remClock"></span></header>
    <main class="rem-main">
      <section class="panel activity rem-panel">
        <div class="act-head"><div class="act-title"><h2 id="remTitle">Remember</h2><span class="count" id="remCountTop"></span></div><div class="dots" id="remDots"></div></div>
        <div class="act-body" id="remBody"></div>
        <div class="act-foot" id="remFoot"></div>
      </section>
    </main>
  </div>
</div>

<!-- Study Screen -->
<div id="studyView" hidden>
<div class="app" id="app">
  <header class="top">
    <a class="back" id="backBtn" href="#/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="backLabel">Home</span></a>
    <div class="course" id="courseName"></div>
    <div class="right">
      <div class="clock" aria-live="off"><b id="clock">--:--</b><span id="studying" hidden></span></div>
      <button class="icon-btn" id="moreBtn" aria-label="More" aria-haspopup="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
  </header>

  <div class="seg-row"><div class="seg" role="group" aria-label="Show">
    <button id="segVideo" aria-pressed="false">Video</button>
    <button id="segStudy" aria-pressed="true">Study</button>
  </div></div>

  <main class="stage" id="stage" data-pane="study">
    <section class="panel lesson" aria-label="Lesson">
      <div class="lesson-head"><div class="crumbs" id="crumbs"></div><div class="meta"><span id="chanLine"></span><a id="ytLink" href="#" target="_blank" rel="noopener">Open on YouTube ↗</a></div></div>
      <h1 id="lessonTitle"></h1>

      <div class="player-slot">
      <div class="player" id="player">
        <div class="mini-bar" id="miniBar">
          <span class="t" id="miniTitle"></span>
          <button id="miniExpand" aria-label="Expand video"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button id="miniDock" aria-label="Return to split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14"/></svg></button>
        </div>
        <div class="fs-top"><button class="fs-return collapse-btn" id="fsReturn" aria-label="Collapse video" title="Collapse (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Collapse</button><b id="fsTitle"></b></div>
        <button class="fs-note-btn" id="fsNoteBtn" aria-label="Write a note" aria-expanded="false" title="Note (N)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
        <button class="fs-cap-btn" id="fsCapBtn" aria-label="Capture what's on screen into your notes" title="Capture to notes (C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 10h8M8 14h5"/></svg></button>
        <form class="fs-note" id="fsNote" hidden><input id="fsNoteText" type="text" maxlength="280" autocomplete="off" enterkeyhint="done" placeholder="Add a note about this lesson" aria-label="New note"><button class="note-add" type="submit">Add</button></form>
        <div class="frame" id="frame">
          <div class="yt-host"><div id="yt"></div></div>
          <div class="yt-shield" id="shield" aria-hidden="true"></div>
          <div class="vid-cover" id="cover"><img id="coverImg" alt=""><div class="vid-msg" id="vidMsg" hidden></div></div>
          <button class="bigplay" id="bigPlay" aria-label="Play"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        </div>
        <div class="controls">
          <button class="ctl primary" id="playBtn" aria-label="Play"></button>
          <button class="ctl hide-mini" id="backTen" aria-label="Back 10 seconds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" font-family="Figtree,Arial" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg></button>
          <button class="ctl hide-mini" id="fwdTen" aria-label="Forward 10 seconds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" font-family="Figtree,Arial" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg></button>
          <input class="scrub" id="scrub" type="range" min="0" max="100" step="1" value="0" aria-label="Seek">
          <span class="time" id="time">0:00 / 0:00</span>
          <div class="vol hide-mini">
            <button class="ctl" id="muteBtn" aria-label="Mute"></button>
            <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
          </div>
          <button class="ctl hide-mini cap-btn" id="capBtn" aria-label="Capture what's on screen into your notes" title="Capture to notes (C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 10h8M8 14h5"/></svg></button>
          <button class="ctl hide-mini" id="speedBtn" aria-label="Playback speed">1×</button>
          <button class="ctl hide-mini expand-btn" id="expandBtn" aria-label="Expand video"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Expand</span></button>
          <button class="ctl fs-exit" id="fsExit" aria-label="Exit full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
          <button class="ctl hide-mini" id="miniBtn" aria-label="Mini player" title="Mini player"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12" y="12" width="6" height="5" rx="1.2" fill="currentColor" stroke="none"/></svg></button>
        </div>
      </div>
      </div>
      <div class="doc-slot" id="docSlot" hidden></div>
      <div class="notes-grip" id="notesGrip" role="separator" aria-orientation="horizontal" aria-label="Resize notes" tabindex="0" title="Drag to resize notes (double-tap to reset)"><span></span></div>
      <section class="notes lesson-notes" id="notes" aria-label="Notes for this lesson"></section>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize video and study panels" tabindex="0" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50"><span class="split-tip" id="splitTip">50 / 50</span></div>

    <section class="panel activity" aria-label="Study activity">
      <div class="x-bar"><button class="collapse-btn" id="qCollapse" aria-label="Collapse questions" title="Collapse (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Collapse</button></div>
      <div class="act-head">
        <div class="act-title"><h2 id="actTitle"></h2><span class="act-right"><span class="count" id="count"></span><button class="icon-btn q-expand" id="qExpand" aria-label="Expand questions" aria-expanded="false" title="Expand"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></span></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="act-body" id="actBody"></div>
      <div class="act-foot" id="actFoot"></div>
    </section>
  </main>
</div>
</div>

<script src="js/art.js"></script>
<script src="js/content.js"></script>
<script src="js/content2.js"></script>
<script src="js/content3.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
